<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>おえかきシールパズル</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#283448;background:#fff9ed}*{box-sizing:border-box}body{margin:0}header{padding:13px 14px 7px;text-align:center}h1{font-size:22px;margin:0;color:#ec667a}header p{font-size:12px;margin:5px 0;color:#697386}.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:5px 8px}button,.upload{background:#fff;border:2px solid #f1b6bd;border-radius:15px;padding:9px 13px;font-weight:700;font-size:14px;color:#55445b;cursor:pointer}.primary{background:#f67e91;color:white;border-color:#f67e91}.upload input{display:none}select{border:2px solid #f1b6bd;border-radius:14px;background:#fff;padding:8px;font-size:14px}#status{text-align:center;font-size:13px;margin:5px 0 0;min-height:19px}main{max-width:620px;margin:auto;padding:6px 9px 20px}canvas{display:block;width:100%;border-radius:17px;background:#fff;touch-action:none;box-shadow:0 3px 16px #8a64752b}footer{text-align:center;color:#697386;font-size:12px;padding:8px}#message{font-weight:bold;color:#de6177}
</style></head><body><header><h1>🎨 おえかきシールパズル</h1><p>じぶんの絵を ばらばらシールにして あそぼう！</p></header><div class="controls"><label class="upload">📷 えをえらぶ<input id="file" type="file" accept="image/*"></label><select id="level" aria-label="難易度"><option value="2">かんたん 4まい</option><option value="3" selected>ふつう 9まい</option><option value="4">むずかしい 16まい</option></select><button class="primary" id="new">🔀 もういちど</button><button id="hint">👀 ヒント ON</button></div><div id="status">ゲームを じゅんびしています…</div><main><canvas id="game" aria-label="シールパズルのゲーム画面"></canvas></main><footer><span id="message">ぴったりのばしょに おくと カチッとはまるよ！</span><p>画像は端末内で処理します。外部へのアップロードはしません。</p></footer><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const file=document.getElementById('file'),level=document.getElementById('level'),status=document.getElementById('status'),msg=document.getElementById('message'),hintBtn=document.getElementById('hint');
let img=null,N=3,pieces=[],board={},scale=1,drag=null,hint=true,completed=false,confetti=[],seed=0;
const W=380,H=650;function rand(a,b){return a+Math.random()*(b-a)}
function sample(){const c=document.createElement('canvas');c.width=600;c.height=600;const g=c.getContext('2d');g.fillStyle='#fff4d6';g.fillRect(0,0,600,600);g.lineCap='round';g.lineJoin='round';g.strokeStyle='#ed736b';g.lineWidth=23;g.beginPath();g.moveTo(105,315);g.lineTo(300,140);g.lineTo(495,315);g.stroke();g.fillStyle='#8bd3e9';g.fillRect(160,305,280,215);g.fillStyle='#ffd06b';g.fillRect(277,408,70,112);g.fillStyle='#fff';g.fillRect(194,340,65,62);g.strokeStyle='#6d9cc5';g.lineWidth=9;g.strokeRect(194,340,65,62);g.fillStyle='#ffc743';g.beginPath();g.arc(468,117,52,0,Math.PI*2);g.fill();g.strokeStyle='#ffb932';g.lineWidth=9;for(let i=0;i<10;i++){let a=i*Math.PI/5;g.beginPath();g.moveTo(468+64*Math.cos(a),117+64*Math.sin(a));g.lineTo(468+83*Math.cos(a),117+83*Math.sin(a));g.stroke()}g.strokeStyle='#6aaf70';g.lineWidth=16;g.beginPath();g.moveTo(75,525);g.lineTo(75,388);g.stroke();g.fillStyle='#80c97d';for(const [x,y,r] of [[75,370,48],[42,398,42],[113,403,43]]){g.beginPath();g.arc(x,y,r,0,7);g.fill()}g.fillStyle='#e789af';for(const [x,y] of [[510,450],[530,480],[486,484]]){g.beginPath();g.arc(x,y,19,0,7);g.fill()}g.fillStyle='#6f628e';g.font='bold 28px sans-serif';g.fillText('わたしの おうち',175,575);img=c;start()}
function makePieces(){const S=board.size,Nn=N;const pts=[];for(let j=0;j<=N;j++){pts[j]=[];for(let i=0;i<=N;i++){pts[j][i]={x:i*S/N+(i===0||i===N?0:rand(-.22,.22)*S/N),y:j*S/N+(j===0||j===N?0:rand(-.22,.22)*S/N)}}}pieces=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++){let verts=[pts[j][i],pts[j][i+1],pts[j+1][i+1],pts[j+1][i]].map(p=>({x:p.x,y:p.y}));let minX=Math.min(...verts.map(p=>p.x)),maxX=Math.max(...verts.map(p=>p.x)),minY=Math.min(...verts.map(p=>p.y)),maxY=Math.max(...verts.map(p=>p.y));pieces.push({verts,minX,maxX,minY,maxY,cx:(minX+maxX)/2,cy:(minY+maxY)/2,x:0,y:0,locked:false,id:j*N+i})}let order=[...pieces.keys()].sort(()=>Math.random()-.5);let cols=3,slotW=(W-30)/cols,slotH=94;pieces.forEach((p,k)=>{let q=order.indexOf(k),c=q%cols,r=Math.floor(q/cols);p.x=15+c*slotW+slotW/2-p.cx;p.y=board.bottom+43+r*slotH+slotH/2-p.cy;});}
function start(){N=+level.value;completed=false;confetti=[];let availableWidth=W-38;board={x:19,y:35,size:availableWidth};board.bottom=board.y+board.size;makePieces();status.textContent='0 / '+pieces.length+' まい できた！';msg.textContent='ぴったりのばしょに おくと カチッとはまるよ！';resize();draw()}
function resize(){const r=canvas.getBoundingClientRect();let w=r.width||380;scale=w/W;let rows=Math.ceil(N*N/3);let h=Math.max(580,board.bottom+70+rows*94+20);canvas.style.height=(h*scale)+'px';let dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*scale*dpr);ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);draw()}
function path(p,dx=0,dy=0){ctx.beginPath();p.verts.forEach((v,i)=>i?ctx.lineTo(board.x+v.x+dx,board.y+v.y+dy):ctx.moveTo(board.x+v.x+dx,board.y+v.y+dy));ctx.closePath()}
function imageCover(){if(!img)return;let iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,s=Math.min(iw,ih),sx=(iw-s)/2,sy=(ih-s)/2;ctx.drawImage(img,sx,sy,s,s,board.x,board.y,board.size,board.size)}
function draw(){if(!img)return;let rows=Math.ceil(N*N/3),h=Math.max(580,board.bottom+70+rows*94+20);ctx.clearRect(0,0,W,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,h);ctx.fillStyle='#fbf1e5';ctx.fillRect(board.x-5,board.y-5,board.size+10,board.size+10);ctx.save();ctx.globalAlpha=hint ? 0.25 : 0.055;imageCover();ctx.restore();ctx.strokeStyle='#e4c4aa';ctx.lineWidth=2;ctx.strokeRect(board.x,board.y,board.size,board.size);for(const p of pieces){if(p.locked)continue;path(p);ctx.fillStyle='#ffffffb0';ctx.fill();ctx.strokeStyle='#dfcbbd';ctx.lineWidth=1.5;ctx.stroke()}ctx.font='bold 14px system-ui';ctx.fillStyle='#957c70';ctx.fillText('↓ シールを ここから うごかそう！',24,board.bottom+26);
for(const p of pieces){if(drag && p===drag.piece)continue;drawPiece(p)}if(drag)drawPiece(drag.piece);if(completed){ctx.fillStyle='#fff8';ctx.fillRect(0,0,W,board.bottom+8);ctx.fillStyle='#dd577b';ctx.textAlign='center';ctx.font='bold 32px system-ui';ctx.fillText('🎉 かんせい！ 🎉',W/2,board.bottom/2);ctx.textAlign='left'}for(const c of confetti){ctx.fillStyle=c.color;ctx.fillRect(c.x,c.y,6,10)}}
function drawPiece(p){ctx.save();let dx=p.locked?0:p.x,dy=p.locked?0:p.y;path(p,dx,dy);ctx.clip();ctx.translate(dx,dy);imageCover();ctx.restore();path(p,dx,dy);ctx.strokeStyle=p.locked?'#ffffff77':'#ffffff';ctx.lineWidth=p.locked?1:3;ctx.stroke();if(!p.locked){ctx.strokeStyle='#5e5368';ctx.lineWidth=1;ctx.stroke()}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function hit(p,x,y){let v=p.verts.map(a=>({x:board.x+a.x+p.x,y:board.y+a.y+p.y}));let inside=false;for(let i=0,j=v.length-1;i<v.length;j=i++){if((v[i].y>y)!==(v[j].y>y)&&x<(v[j].x-v[i].x)*(y-v[i].y)/(v[j].y-v[i].y)+v[i].x)inside=!inside}return inside}
canvas.addEventListener('pointerdown',e=>{if(completed)return;let a=point(e);for(let k=pieces.length-1;k>=0;k--){let p=pieces[k];if(!p.locked&&hit(p,a.x,a.y)){drag={piece:p,ox:a.x-p.x,oy:a.y-p.y};pieces.splice(k,1);pieces.push(p);if(canvas.setPointerCapture){try{canvas.setPointerCapture(e.pointerId)}catch(err){}}draw();break}}});canvas.addEventListener('pointermove',e=>{if(!drag)return;let a=point(e),p=drag.piece;p.x=a.x-drag.ox;p.y=a.y-drag.oy;draw()});function release(){if(!drag)return;let p=drag.piece;drag=null;if(Math.hypot(p.x,p.y)<Math.max(23,board.size/N*.33)){p.x=0;p.y=0;p.locked=true;let count=pieces.filter(x=>x.locked).length;status.textContent=count+' / '+pieces.length+' まい できた！';if(count===pieces.length){completed=true;msg.textContent='すごい！ ぜんぶ できたね！';for(let i=0;i<80;i++)confetti.push({x:rand(10,370),y:rand(20,board.bottom),color:['#ff7b9d','#f7c74b','#76cdd2','#aa91e8'][i%4]})}}draw()};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);window.addEventListener('pointerup',release);
file.addEventListener('change',e=>{const f=e.target.files && e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('画像ファイルを選んでね');return}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;URL.revokeObjectURL(u);start()};im.onerror=()=>{URL.revokeObjectURL(u);alert('この画像は読み込めませんでした')};im.src=u});level.addEventListener('change',start);document.getElementById('new').addEventListener('click',start);hintBtn.addEventListener('click',()=>{hint=!hint;hintBtn.textContent=hint?'👀 ヒント ON':'🙈 ヒント OFF';draw()});window.addEventListener('resize',resize);try{sample()}catch(err){status.textContent='起動エラー: '+err.message;console.error(err)};})();
</script></body></html>
