<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>おえかきシールパズル</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#283448;background:#fff9ed}*{box-sizing:border-box}body{margin:0}header{padding:13px 14px 7px;text-align:center}h1{font-size:22px;margin:0;color:#ec667a}header p{font-size:12px;margin:5px 0;color:#697386}.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:5px 8px}button,.upload{background:#fff;border:2px solid #f1b6bd;border-radius:15px;padding:9px 13px;font-weight:700;font-size:14px;color:#55445b;cursor:pointer}.primary{background:#f67e91;color:white;border-color:#f67e91}.upload input{display:none}select{border:2px solid #f1b6bd;border-radius:14px;background:#fff;padding:8px;font-size:14px}#status{text-align:center;font-size:13px;margin:5px 0 0;min-height:19px}main{max-width:620px;margin:auto;padding:6px 9px 20px}canvas{display:block;width:100%;border-radius:17px;background:#fff;touch-action:none;box-shadow:0 3px 16px #8a64752b}footer{text-align:center;color:#697386;font-size:12px;padding:8px}#message{font-weight:bold;color:#de6177}

</style></head><body><header><h1>🎨 おえかきシールパズル</h1><p>じぶんの絵を ばらばらシールにして あそぼう！</p></header><div class="controls"><label class="upload">📷 えをえらぶ<input id="file" type="file" accept="image/*"></label><select id="level" aria-label="難易度"><option value="2">かんたん 4まい</option><option value="3" selected>ふつう 9まい</option><option value="4">むずかしい 16まい</option></select><button class="primary" id="new">🔀 もういちど</button><button id="hint">👀 ヒント ON</button></div><div id="status">ゲームを じゅんびしています…</div><main><canvas id="game" aria-label="シールパズルのゲーム画面"></canvas></main><footer><span id="message">ぴったりのばしょに おくと カチッとはまるよ！</span><p>画像は端末内で処理します。外部へのアップロードはしません。</p></footer><div id="page-scroll" role="scrollbar" aria-label="ページを上下にうごかす" aria-controls="game" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0" hidden><span id="scroll-thumb" aria-hidden="true"></span></div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const file=document.getElementById('file'),level=document.getElementById('level'),status=document.getElementById('status'),msg=document.getElementById('message'),hintBtn=document.getElementById('hint');
let img=null,N=3,pieces=[],board={},scale=1,drag=null,hint=true,completed=false,confetti=[],seed=0;
const scrollTrack=document.getElementById('page-scroll'),scrollThumb=document.getElementById('scroll-thumb');
let scrollDrag=null,scrollFrame=0,lastPointerY=null,computedThumbY=0;
const debugScroll=new URLSearchParams(window.location.search).get('debugScroll')==='1';
const scrollLog=[];
function logScroll(type,e){
 if(!debugScroll)return;
 const t=scrollTrack.getBoundingClientRect(),b=scrollThumb.getBoundingClientRect(),v=window.visualViewport;
 const pointerY=e&&Number.isFinite(e.clientY)?e.clientY:lastPointerY;
 scrollLog.push({time:performance.now(),event:type,pointerClientY:pointerY,scrollY:window.scrollY,
  viewportHeight:v?v.height:null,viewportOffsetTop:v?v.offsetTop:null,innerHeight:window.innerHeight,
  trackTop:t.top,trackHeight:t.height,thumbTop:b.top,thumbHeight:b.height,thumbY:computedThumbY,
  dragging:!!scrollDrag,mode:scrollDrag?scrollDrag.mode:null,grabOffset:scrollDrag?scrollDrag.grabOffset:null,
  gripError:scrollDrag&&pointerY!==null?pointerY-b.top-scrollDrag.grabOffset:null,
  requestedScroll:scrollDrag?scrollDrag.requestedScroll:null});
 if(scrollLog.length>1500)scrollLog.shift();
}
if(debugScroll){
 const panel=document.createElement('details');panel.id='scroll-debug';
 panel.innerHTML='<summary>スクロール診断 v0.3.3</summary><p>再現後に「ログを表示」を押し、欄内のテキストをコピーしてください。直近1500件を端末内だけに記録します。</p><button type="button">ログを表示</button><button type="button">記録をクリア</button><textarea readonly aria-label="スクロール診断ログ"></textarea>';
 document.body.appendChild(panel);
 const buttons=panel.querySelectorAll('button'),output=panel.querySelector('textarea');
 buttons[0].addEventListener('click',()=>{output.value=JSON.stringify({version:'0.3.3',exportedAt:new Date().toISOString(),userAgent:navigator.userAgent,records:scrollLog.slice()},null,2);output.focus();output.select()});
 buttons[1].addEventListener('click',()=>{scrollLog.length=0;output.value=''});
}
function paintThumb(y,travel){computedThumbY=y;scrollThumb.style.transform='translateY('+y+'px)';scrollTrack.setAttribute('aria-valuenow',Math.round(travel?y/travel*100:0))}
function scrollMetrics(){
 const root=document.scrollingElement||document.documentElement,viewHeight=document.documentElement.clientHeight||window.innerHeight;
 const rect=scrollTrack.getBoundingClientRect(),height=rect.height,total=root.scrollHeight;
 const max=Math.max(0,total-viewHeight),thumb=48;
 return {height,max,thumb,travel:Math.max(0,height-thumb),top:rect.top};
}
function updateScroll(){
 if(scrollDrag){renderDrag();return}
 // CSS owns the idle track size; measure its actual rendered box, never offsetTop.
 scrollTrack.hidden=false;
 const m=scrollMetrics();scrollTrack.hidden=m.max<=1||m.travel<=0;
 scrollThumb.style.height=m.thumb+'px';
 const ratio=m.max?Math.max(0,Math.min(1,window.scrollY/m.max)):0;
 paintThumb(ratio*m.travel,m.travel);
}
function scheduleScroll(e){
 if(e&&e.type)logScroll((e.currentTarget===window.visualViewport?'visualViewport.':'')+e.type,e);
 if(!scrollFrame)scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;updateScroll();logScroll('frame')});
}
function renderDrag(forceScroll=false){
 const d=scrollDrag;if(!d)return;
 // One rail-local coordinate drives both the thumb and the page.
 // Read the origin only on input/viewport/scroll events, never in a polling loop.
 const top=scrollTrack.getBoundingClientRect().top;
 const y=Math.max(0,Math.min(d.travel,lastPointerY-top-d.grabOffset));
 if(y!==d.y||forceScroll){
  if(y!==d.y)paintThumb(y,d.travel);
  d.y=y;d.requestedScroll=y/d.travel*d.max;
  window.scrollTo({left:0,top:d.requestedScroll,behavior:'auto'});
 }
}
function moveScroll(e){
 const d=scrollDrag;if(!d||d.travel<=0||d.max<=1)return;
 lastPointerY=e.clientY;renderDrag(true);logScroll(e.type,e);
}
scrollTrack.addEventListener('pointerdown',e=>{
 if(drag||scrollDrag||!e.isPrimary||e.button!==0)return;
 // Read what the user actually touched before any synchronization can move it.
 const track=scrollTrack.getBoundingClientRect(),thumb=scrollThumb.getBoundingClientRect(),m=scrollMetrics();

 e.preventDefault();e.stopPropagation();
 const onThumb=scrollThumb.contains(e.target);
 const startThumbY=onThumb?thumb.top-track.top:Math.max(0,Math.min(travel,e.clientY-track.top-thumb.height/2));
 try{scrollTrack.setPointerCapture(e.pointerId)}catch(err){return}
 scrollDrag={id:e.pointerId,mode:onThumb?'thumb':'track',startClientY:e.clientY,startThumbY,trackTop:track.top,
  height:track.height,thumb:thumb.height,travel,max:m.max,grabOffset:e.clientY-(track.top+startThumbY)};
 scrollTrack.style.height=track.height+'px';scrollThumb.style.height=thumb.height+'px';
 document.documentElement.classList.add('scroll-direct');
 scrollTrack.classList.add('scrolling');moveScroll(e);
});
scrollTrack.addEventListener('pointermove',e=>{if(scrollDrag&&e.pointerId===scrollDrag.id){e.preventDefault();moveScroll(e)}});
function endScroll(e){
 if(!scrollDrag||e.pointerId!==scrollDrag.id)return;
 logScroll(e.type,e);scrollDrag=null;
 scrollTrack.style.height='';updateScroll();
 scrollTrack.classList.remove('scrolling');document.documentElement.classList.remove('scroll-direct');

 logScroll('release-sync',e);scheduleScroll();
}
for(const type of ['pointerup','pointercancel','lostpointercapture'])scrollTrack.addEventListener(type,endScroll);
scrollTrack.addEventListener('keydown',e=>{
 if(drag||scrollDrag)return;const m=scrollMetrics(),steps={ArrowDown:60,ArrowUp:-60,PageDown:window.innerHeight*.8,PageUp:-window.innerHeight*.8,Home:-m.max,End:m.max};
 if(Object.prototype.hasOwnProperty.call(steps,e.key)){e.preventDefault();window.scrollTo(0,Math.max(0,Math.min(m.max,window.scrollY+steps[e.key])));scheduleScroll()}
});
window.addEventListener('scroll',scheduleScroll,{passive:true});window.addEventListener('resize',scheduleScroll);
if(window.visualViewport){window.visualViewport.addEventListener('resize',scheduleScroll);window.visualViewport.addEventListener('scroll',scheduleScroll)}
if(window.ResizeObserver)new ResizeObserver(scheduleScroll).observe(document.body);
const W=380,H=650;function rand(a,b){return a+Math.random()*(b-a)}
function sample(){const c=document.createElement('canvas');c.width=600;c.height=600;const g=c.getContext('2d');g.fillStyle='#fff4d6';g.fillRect(0,0,600,600);g.lineCap='round';g.lineJoin='round';g.strokeStyle='#ed736b';g.lineWidth=23;g.beginPath();g.moveTo(105,315);g.lineTo(300,140);g.lineTo(495,315);g.stroke();g.fillStyle='#8bd3e9';g.fillRect(160,305,280,215);g.fillStyle='#ffd06b';g.fillRect(277,408,70,112);g.fillStyle='#fff';g.fillRect(194,340,65,62);g.strokeStyle='#6d9cc5';g.lineWidth=9;g.strokeRect(194,340,65,62);g.fillStyle='#ffc743';g.beginPath();g.arc(468,117,52,0,Math.PI*2);g.fill();g.strokeStyle='#ffb932';g.lineWidth=9;for(let i=0;i<10;i++){let a=i*Math.PI/5;g.beginPath();g.moveTo(468+64*Math.cos(a),117+64*Math.sin(a));g.lineTo(468+83*Math.cos(a),117+83*Math.sin(a));g.stroke()}g.strokeStyle='#6aaf70';g.lineWidth=16;g.beginPath();g.moveTo(75,525);g.lineTo(75,388);g.stroke();g.fillStyle='#80c97d';for(const [x,y,r] of [[75,370,48],[42,398,42],[113,403,43]]){g.beginPath();g.arc(x,y,r,0,7);g.fill()}g.fillStyle='#e789af';for(const [x,y] of [[510,450],[530,480],[486,484]]){g.beginPath();g.arc(x,y,19,0,7);g.fill()}g.fillStyle='#6f628e';g.font='bold 28px sans-serif';g.fillText('わたしの おうち',175,575);img=c;start()}
function makePieces(){const S=board.size,Nn=N;const pts=[];for(let j=0;j<=N;j++){pts[j]=[];for(let i=0;i<=N;i++){pts[j][i]={x:i*S/N+(i===0||i===N?0:rand(-.22,.22)*S/N),y:j*S/N+(j===0||j===N?0:rand(-.22,.22)*S/N)}}}pieces=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++){let verts=[pts[j][i],pts[j][i+1],pts[j+1][i+1],pts[j+1][i]].map(p=>({x:p.x,y:p.y}));let minX=Math.min(...verts.map(p=>p.x)),maxX=Math.max(...verts.map(p=>p.x)),minY=Math.min(...verts.map(p=>p.y)),maxY=Math.max(...verts.map(p=>p.y));pieces.push({verts,minX,maxX,minY,maxY,cx:(minX+maxX)/2,cy:(minY+maxY)/2,x:0,y:0,locked:false,id:j*N+i})}let order=[...pieces.keys()].sort(()=>Math.random()-.5);let cols=3,slotW=(W-30)/cols,slotH=94;pieces.forEach((p,k)=>{let q=order.indexOf(k),c=q%cols,r=Math.floor(q/cols);p.x=15+c*slotW+slotW/2-p.cx;p.y=board.bottom+43+r*slotH+slotH/2-p.cy;});}
function start(){cancelDrag();N=+level.value;completed=false;confetti=[];let availableWidth=W-38;board={x:19,y:35,size:availableWidth};board.bottom=board.y+board.size;makePieces();status.textContent='0 / '+pieces.length+' まい できた！';msg.textContent='ぴったりのばしょに おくと カチッとはまるよ！';resize();draw()}
function resize(){cancelDrag();scheduleScroll();const r=canvas.getBoundingClientRect();let w=r.width||380;scale=w/W;let rows=Math.ceil(N*N/3);let h=Math.max(580,board.bottom+70+rows*94+20);canvas.style.height=(h*scale)+'px';let dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*scale*dpr);ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);draw()}
function path(p,dx=0,dy=0){ctx.beginPath();p.verts.forEach((v,i)=>i?ctx.lineTo(board.x+v.x+dx,board.y+v.y+dy):ctx.moveTo(board.x+v.x+dx,board.y+v.y+dy));ctx.closePath()}
function imageCover(){if(!img)return;let iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,s=Math.min(iw,ih),sx=(iw-s)/2,sy=(ih-s)/2;ctx.drawImage(img,sx,sy,s,s,board.x,board.y,board.size,board.size)}
function draw(){if(!img)return;let rows=Math.ceil(N*N/3),h=Math.max(580,board.bottom+70+rows*94+20);ctx.clearRect(0,0,W,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,h);ctx.fillStyle='#fbf1e5';ctx.fillRect(board.x-5,board.y-5,board.size+10,board.size+10);ctx.save();ctx.globalAlpha=hint ? 0.25 : 0.055;imageCover();ctx.restore();ctx.strokeStyle='#e4c4aa';ctx.lineWidth=2;ctx.strokeRect(board.x,board.y,board.size,board.size);for(const p of pieces){if(p.locked)continue;path(p);ctx.fillStyle='#ffffffb0';ctx.fill();ctx.strokeStyle='#dfcbbd';ctx.lineWidth=1.5;ctx.stroke()}ctx.font='bold 14px system-ui';ctx.fillStyle='#957c70';ctx.fillText('↓ シールを ここから うごかそう！',24,board.bottom+26);
for(const p of pieces){if(drag && p===drag.piece)continue;drawPiece(p)}if(drag)drawPiece(drag.piece);if(completed){ctx.fillStyle='#fff8';ctx.fillRect(0,0,W,board.bottom+8);ctx.fillStyle='#dd577b';ctx.textAlign='center';ctx.font='bold 32px system-ui';ctx.fillText('🎉 かんせい！ 🎉',W/2,board.bottom/2);ctx.textAlign='left'}for(const c of confetti){ctx.fillStyle=c.color;ctx.fillRect(c.x,c.y,6,10)}}
function drawPiece(p){ctx.save();let dx=p.locked?0:p.x,dy=p.locked?0:p.y;path(p,dx,dy);ctx.clip();ctx.translate(dx,dy);imageCover();ctx.restore();path(p,dx,dy);ctx.strokeStyle=p.locked?'#ffffff77':'#ffffff';ctx.lineWidth=p.locked?1:3;ctx.stroke();if(!p.locked){ctx.strokeStyle='#5e5368';ctx.lineWidth=1;ctx.stroke()}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function hit(p,x,y){let v=p.verts.map(a=>({x:board.x+a.x+p.x,y:board.y+a.y+p.y}));let inside=false;for(let i=0,j=v.length-1;i<v.length;j=i++){if((v[i].y>y)!==(v[j].y>y)&&x<(v[j].x-v[i].x)*(y-v[i].y)/(v[j].y-v[i].y)+v[i].x)inside=!inside}return inside}
canvas.addEventListener('pointerdown',e=>{if(completed||drag||scrollDrag||!e.isPrimary||e.button!==0)return;let a=point(e);for(let k=pieces.length-1;k>=0;k--){let p=pieces[k];if(!p.locked&&hit(p,a.x,a.y)){e.preventDefault();drag={id:e.pointerId,piece:p,ox:a.x-p.x,oy:a.y-p.y};pieces.splice(k,1);pieces.push(p);if(canvas.setPointerCapture){try{canvas.setPointerCapture(e.pointerId)}catch(err){}}draw();break}}});canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();let a=point(e),p=drag.piece;p.x=a.x-drag.ox;p.y=a.y-drag.oy;draw()});function cancelDrag(e){if(!drag||(e&&e.pointerId!==drag.id))return;const id=drag.id;drag=null;if(canvas.hasPointerCapture(id))canvas.releasePointerCapture(id);draw()}function release(e){if(!drag||e.pointerId!==drag.id)return;let p=drag.piece;cancelDrag(e);if(Math.hypot(p.x,p.y)<Math.max(23,board.size/N*.33)){p.x=0;p.y=0;p.locked=true;let count=pieces.filter(x=>x.locked).length;status.textContent=count+' / '+pieces.length+' まい できた！';if(count===pieces.length){completed=true;msg.textContent='すごい！ ぜんぶ できたね！';for(let i=0;i<80;i++)confetti.push({x:rand(10,370),y:rand(20,board.bottom),color:['#ff7b9d','#f7c74b','#76cdd2','#aa91e8'][i%4]})}}draw()};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',cancelDrag);canvas.addEventListener('lostpointercapture',cancelDrag);window.addEventListener('pointerup',release);
file.addEventListener('change',e=>{const f=e.target.files && e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('画像ファイルを選んでね');return}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;URL.revokeObjectURL(u);start()};im.onerror=()=>{URL.revokeObjectURL(u);alert('この画像は読み込めませんでした')};im.src=u});level.addEventListener('change',start);document.getElementById('new').addEventListener('click',start);hintBtn.addEventListener('click',()=>{hint=!hint;hintBtn.textContent=hint?'👀 ヒント ON':'🙈 ヒント OFF';draw()});window.addEventListener('resize',resize);try{sample()}catch(err){status.textContent='起動エラー: '+err.message;console.error(err)};})();
</script></body></html>
